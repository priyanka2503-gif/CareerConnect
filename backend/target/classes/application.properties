
# ==========================================
# CareerConnect Application Configuration
# ==========================================

spring.application.name=careerconnect-backend

# Server Configuration
server.port=${PORT:8083}

# ==========================================
# PostgreSQL Database Configuration
# ==========================================

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# Hibernate and JPA Configuration
# ==========================================

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================
# Security and JWT Configuration
# ==========================================

careerconnect.jwt.secret=${JWT_SECRET}
careerconnect.jwt.expiration-ms=86400000

# ==========================================
# Logging Configuration
# ==========================================

logging.level.com.careerconnect=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
