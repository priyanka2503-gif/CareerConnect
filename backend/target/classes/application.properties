# ==========================================
# CareerConnect Application Configuration
# ==========================================

spring.application.name=careerconnect-backend
server.port=${SERVER_PORT:${PORT:8083}}

# ------------------------------------------
# Database Configuration (PostgreSQL)
# ------------------------------------------
# Customize via environment variables or replace placeholders below
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:careerconnect_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:Priyanka@123}}
spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------------------------
# Hibernate & JPA Configuration
# ------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Hibernate 6 automatically detects the dialect from the JDBC connection URL
spring.jpa.open-in-view=false

# ------------------------------------------
# Security & JWT Configuration
# ------------------------------------------
careerconnect.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B597036
careerconnect.jwt.expiration-ms=86400000

# ------------------------------------------
# Logging
# ------------------------------------------
logging.level.com.careerconnect=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
