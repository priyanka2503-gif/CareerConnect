# ==========================================
# In-Memory H2 Profile for Instant Zero-Setup Testing
# Run with: .\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=h2
# ==========================================

spring.datasource.url=jdbc:h2:mem:careerconnect_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# H2 Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
